name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  go-lint-test:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: agent/go.sum

      - name: Verify dependencies
        run: |
          cd agent
          go mod verify

      - name: Run Go Tests
        run: |
          cd agent
          go test -v -race ./...

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          sudo cp $(go env GOPATH)/bin/golangci-lint /usr/local/bin/golangci-lint

      - name: Run golangci-lint
        run: |
          cd agent
          golangci-lint version
          golangci-lint run ./...

  macos-bundle:
    name: macOS Build & Bundle
    runs-on: macos-14
    needs: go-lint-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: agent/go.sum

      - name: Install create-dmg
        run: brew install create-dmg || true

      - name: Build Agent Binary
        run: sh scripts/build.sh

      - name: Bundle NetTracker.app
        run: sh scripts/bundle.sh

      - name: Verify App Structure
        run: |
          test -f build/NetTracker.app/Contents/MacOS/NetTracker
          test -f build/NetTracker.app/Contents/Library/LoginItems/NetTrackerAgent
          test -f build/NetTracker.app/Contents/Info.plist
          test -f build/NetTracker.app/Contents/Resources/AppIcon.icns

      - name: Ad-hoc Sign App Bundle
        run: sh scripts/sign.sh

      - name: Build DMG Installer
        run: sh scripts/dmg.sh

      - name: Verify DMG
        run: test -f build/NetTracker.dmg

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetTracker.app
          path: build/NetTracker.app

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetTracker.dmg
          path: build/NetTracker.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NetTracker.dmg
          generate_release_notes: true
          draft: false
          prerelease: false

